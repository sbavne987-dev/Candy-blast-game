<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Candy Blast - Sohan Studio</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:16px 10px 30px;
 font-family:Arial,sans-serif;color:white;text-align:center;
 background:linear-gradient(145deg,#45217c,#17102f 65%,#090817);
 transition:background .5s
}
body.world1{background:linear-gradient(145deg,#7139a8,#24104e 65%,#090817)}
body.world2{background:linear-gradient(145deg,#8b482d,#38192c 65%,#100817)}
body.world3{background:linear-gradient(145deg,#176a9b,#22245f 65%,#090817)}
body.world4{background:linear-gradient(145deg,#b64e9c,#54266e 65%,#100817)}
body.world5{background:linear-gradient(145deg,#287c62,#173b50 65%,#090817)}
h1{font-size:clamp(27px,7vw,42px);margin:8px 0;color:#ffe36e;text-shadow:0 3px 15px #ff4ca6}
.subtitle{color:#e5d8ff;margin:5px 0 18px;font-size:16px}
.panel{max-width:460px;margin:12px auto;padding:13px;background:#ffffff19;border:1px solid #ffffff38;border-radius:20px;box-shadow:0 8px 25px #0005}
.stats{display:flex;justify-content:space-around;gap:7px}
.stat{flex:1;background:#ffffff17;border-radius:13px;padding:9px 3px}
.stat small{display:block;color:#e0d5ff;font-size:11px}
.stat strong{font-size:clamp(19px,5vw,25px);color:#ffe36e}
#levelName{font-size:19px;color:#fff;margin:12px 0 5px;font-weight:bold}
#mission{font-size:14px;color:#fff0a7;line-height:1.5}
#targets{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:10px}
.target{background:#160d35a8;border:1px solid #ffffff35;border-radius:12px;padding:7px 12px;font-size:14px}
.target b{color:#ffe36e;font-size:17px}
#board{
 width:min(96vw,440px);aspect-ratio:1;margin:15px auto;
 display:grid;grid-template-columns:repeat(8,1fr);gap:4px;
 padding:7px;background:#100c28c9;border:2px solid #b69aff;
 border-radius:18px;touch-action:pan-y;user-select:none;
 box-shadow:0 10px 30px #0006
}
.cell{
 min-width:0;aspect-ratio:1;border-radius:10px;
 display:flex;align-items:center;justify-content:center;
 font-size:clamp(18px,6vw,34px);
 background:linear-gradient(145deg,#ffffff30,#ffffff0c);
 box-shadow:inset 0 2px 4px #ffffff20,0 2px 3px #0005;
 cursor:pointer;transition:transform .12s
}
.cell.selected{background:#ffe36e66;outline:3px solid #ffe36e;transform:scale(.9)}
.cell.empty{visibility:hidden}
#message{min-height:27px;color:#ffe875;font-weight:bold;margin:8px}
button{border:0;border-radius:14px;padding:13px 20px;font-size:15px;font-weight:bold;color:#271443;background:linear-gradient(135deg,#ffe875,#ffae50);cursor:pointer;margin:5px}
button:active{transform:scale(.96)}
#overlay{display:none;position:fixed;inset:0;background:#08051deF;align-items:center;justify-content:center;padding:20px;z-index:5}
.dialog{background:linear-gradient(145deg,#57358a,#251548);border:2px solid #ffe36e;border-radius:23px;padding:25px;max-width:340px;width:100%;box-shadow:0 15px 50px #0009}
.dialog h2{color:#ffe36e;font-size:28px}
.dialog p{line-height:1.5;color:#f4eaff}
footer{font-size:12px;color:#b9addd;margin-top:22px}
</style>
</head>
<body class="world1">
<h1>🍬 CANDY BLAST 🍭</h1>
<p class="subtitle">Complete missions • Explore sweet worlds!</p>

<div class="panel">
 <div class="stats">
  <div class="stat"><small>LEVEL</small><strong id="level">1</strong></div>
  <div class="stat"><small>MOVES LEFT</small><strong id="moves">20</strong></div>
  <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
 </div>
 <div id="levelName">Candy Garden</div>
 <div id="mission">Mission: Collect candies</div>
 <div id="targets"></div>
</div>

<div id="board"></div>
<div id="message">Match 3 or more candies to complete your mission!</div>
<button onclick="restartLevel()">↻ Restart Level</button>
<button onclick="toggleSound()" id="soundBtn">🔊 Sound ON</button>

<div id="overlay">
 <div class="dialog">
  <h2 id="resultTitle">Level Complete!</h2>
  <p id="resultText"></p>
  <button id="nextBtn" onclick="nextLevel()">Next Level ➜</button>
  <button onclick="restartLevel()">Play Again</button>
 </div>
</div>
<footer>SOHAN STUDIO • CANDY BLAST</footer>

<script>
"use strict";
const N=8;
const sweets=["🍬","🍭","🍫","🍩","🍪","🧁"];
const levels=[
 {name:"Candy Garden",world:1,moves:20,mission:"Collect 12 wrapped candies",goals:[[0,12]]},
 {name:"Chocolate World",world:2,moves:22,mission:"Collect 15 chocolates",goals:[[2,15]]},
 {name:"Lollipop Island",world:3,moves:22,mission:"Collect 18 lollipops",goals:[[1,18]]},
 {name:"Cupcake City",world:4,moves:24,mission:"Collect cupcakes and cookies",goals:[[5,12],[4,10]]},
 {name:"Donut Valley",world:5,moves:23,mission:"Collect 20 donuts",goals:[[3,20]]},
 {name:"Sweet Forest",world:1,moves:24,mission:"Collect candies and lollipops",goals:[[0,12],[1,12]]},
 {name:"Choco Mountain",world:2,moves:25,mission:"Collect 22 chocolates",goals:[[2,22]]},
 {name:"Rainbow Beach",world:3,moves:24,mission:"Collect 20 lollipops",goals:[[1,20]]},
 {name:"Pink Bakery",world:4,moves:25,mission:"Collect cupcakes and donuts",goals:[[5,14],[3,12]]},
 {name:"Green Sweetland",world:5,moves:26,mission:"Collect 25 cookies",goals:[[4,25]]},
 {name:"Candy Castle",world:1,moves:25,mission:"Collect 18 wrapped candies and 15 chocolates",goals:[[0,18],[2,15]]},
 {name:"Chocolate River",world:2,moves:26,mission:"Collect 25 chocolates",goals:[[2,25]]},
 {name:"Lollipop Kingdom",world:3,moves:26,mission:"Collect 25 lollipops",goals:[[1,25]]},
 {name:"Cupcake Paradise",world:4,moves:27,mission:"Collect cupcakes and cookies",goals:[[5,18],[4,15]]},
 {name:"Sweet Jungle",world:5,moves:27,mission:"Collect 28 donuts",goals:[[3,28]]},
 {name:"Golden Candy Road",world:1,moves:28,mission:"Collect three kinds of sweets",goals:[[0,15],[1,15],[2,15]]},
 {name:"Choco Palace",world:2,moves:28,mission:"Collect 30 chocolates",goals:[[2,30]]},
 {name:"Rainbow Kingdom",world:3,moves:29,mission:"Collect lollipops and cupcakes",goals:[[1,20],[5,18]]},
 {name:"Sweet Dreams",world:4,moves:30,mission:"Collect cookies and donuts",goals:[[4,20],[3,20]]},
 {name:"Candy Blast Finale",world:5,moves:32,mission:"Collect all five kinds of sweets",goals:[[0,12],[1,12],[2,12],[3,12],[5,12]]}
];

let levelIndex=0,board=[],score=0,moves=20,progress=[];
let selected=null,busy=false,ended=false,soundOn=true,audioCtx=null;
let touchStart=null,suppressClick=false;

const boardEl=document.getElementById("board");
const messageEl=document.getElementById("message");
const $=id=>document.getElementById(id);
const config=()=>levels[levelIndex];

function rand(){return Math.floor(Math.random()*sweets.length)}
function makeBoard(){
 board=Array.from({length:N},()=>Array(N).fill(-1));
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){
  let v;
  do{v=rand()}
  while((c>=2&&board[r][c-1]===v&&board[r][c-2]===v)||
        (r>=2&&board[r-1][c]===v&&board[r-2][c]===v));
  board[r][c]=v;
 }
}
function startLevel(){
 const cfg=config();
 document.body.className="world"+cfg.world;
 moves=cfg.moves;score=0;selected=null;busy=false;ended=false;
 progress=cfg.goals.map(()=>0);
 makeBoard();render();
 $("overlay").style.display="none";
 messageEl.textContent="Complete the mission to win!";
}
function render(){
 const cfg=config();
 $("level").textContent=levelIndex+1;
 $("moves").textContent=moves;
 $("score").textContent=score;
 $("levelName").textContent=cfg.name;
 $("mission").textContent="Mission: "+cfg.mission;
 $("targets").innerHTML=cfg.goals.map((g,i)=>
  `<div class="target">${sweets[g[0]]} <b>${Math.min(progress[i],g[1])}/${g[1]}</b></div>`
 ).join("");
 boardEl.innerHTML="";
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){
  const el=document.createElement("div");
  el.className="cell"+(board[r][c]<0?" empty":"");
  el.textContent=board[r][c]<0?"":sweets[board[r][c]];
  if(selected&&selected.r===r&&selected.c===c)el.classList.add("selected");
  el.dataset.r=r;el.dataset.c=c;
  boardEl.appendChild(el);
 }
}
function matches(){
 const found=new Set();
 for(let r=0;r<N;r++){
  let c=0;
  while(c<N){
   let end=c+1;
   while(end<N&&board[r][c]>=0&&board[r][end]===board[r][c])end++;
   if(board[r][c]>=0&&end-c>=3)for(let x=c;x<end;x++)found.add(r+","+x);
   c=end;
  }
 }
 for(let c=0;c<N;c++){
  let r=0;
  while(r<N){
   let end=r+1;
   while(end<N&&board[r][c]>=0&&board[end][c]===board[r][c])end++;
   if(board[r][c]>=0&&end-r>=3)for(let x=r;x<end;x++)found.add(x+","+c);
   r=end;
  }
 }
 return [...found].map(s=>s.split(",").map(Number));
}
function adjacent(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1}
function swap(a,b){
 const t=board[a.r][a.c];board[a.r][a.c]=board[b.r][b.c];board[b.r][b.c]=t;
}
function playSound(){
 if(!soundOn)return;
 try{
  audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.frequency.value=620;g.gain.value=.045;
  o.start();o.stop(audioCtx.currentTime+.1);
 }catch(e){}
}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));

async function clearMatches(){
 while(true){
  const found=matches();
  if(!found.length)break;
  const counts=Array(sweets.length).fill(0);
  found.forEach(([r,c])=>counts[board[r][c]]++);
  config().goals.forEach((goal,i)=>{
   progress[i]+=counts[goal[0]];
  });
  score+=found.length*10;
  found.forEach(([r,c])=>board[r][c]=-1);
  playSound();render();await wait(180);

  for(let c=0;c<N;c++){
   let write=N-1;
   for(let r=N-1;r>=0;r--){
    if(board[r][c]>=0){
     board[write][c]=board[r][c];
     if(write!==r)board[r][c]=-1;
     write--;
    }
   }
   for(let r=write;r>=0;r--)board[r][c]=rand();
  }
  render();await wait(160);
 }
}
function missionComplete(){
 return config().goals.every((g,i)=>progress[i]>=g[1]);
}
function showResult(won){
 ended=true;
 $("resultTitle").textContent=won?"🎉 LEVEL COMPLETE!":"😢 TRY AGAIN";
 $("resultText").textContent=won?
  "Amazing! You completed "+config().name+". Your score: "+score:
  "Moves are over. Complete the mission to continue.";
 $("nextBtn").style.display=won?"inline-block":"none";
 $("nextBtn").textContent=levelIndex===levels.length-1?"Finish Game 🏆":"Next Level ➜";
 $("overlay").style.display="flex";
}
async function choose(r,c){
 if(busy||ended)return;
 const here={r,c};
 if(!selected){selected=here;render();return}
 if(selected.r===r&&selected.c===c){selected=null;render();return}
 if(!adjacent(selected,here)){selected=here;render();return}
 const old=selected;selected=null;busy=true;
 swap(old,here);render();await wait(120);
 if(!matches().length){
  swap(old,here);render();
  messageEl.textContent="No match! Try another move.";
 }else{
  moves--;
  messageEl.textContent="Sweet! Great match!";
  await clearMatches();
  if(missionComplete())showResult(true);
  else if(moves<=0)showResult(false);
  else messageEl.textContent="Keep going! Complete your mission.";
 }
 busy=false;
}
function restartLevel(){startLevel()}
function nextLevel(){
 if(levelIndex===levels.length-1){
  $("resultTitle").textContent="🏆 YOU ARE A CANDY CHAMPION!";
  $("resultText").textContent="You completed all 20 levels. Amazing!";
  $("nextBtn").style.display="none";
  return;
 }
 levelIndex++;
 startLevel();
}
function toggleSound(){
 soundOn=!soundOn;
 $("soundBtn").textContent=soundOn?"🔊 Sound ON":"🔇 Sound OFF";
}
boardEl.addEventListener("click",e=>{
 const cell=e.target.closest(".cell");
 if(!cell)return;
 if(suppressClick){suppressClick=false;return}
 choose(Number(cell.dataset.r),Number(cell.dataset.c));
});
boardEl.addEventListener("touchstart",e=>{
 const cell=e.target.closest(".cell");
 if(!cell||busy||ended)return;
 touchStart={r:+cell.dataset.r,c:+cell.dataset.c,x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
boardEl.addEventListener("touchend",e=>{
 if(!touchStart)return;
 const dx=e.changedTouches[0].clientX-touchStart.x;
 const dy=e.changedTouches[0].clientY-touchStart.y;
 const start=touchStart;touchStart=null;
 if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
 let r=start.r,c=start.c;
 if(Math.abs(dx)>Math.abs(dy))c+=dx>0?1:-1;
 else r+=dy>0?1:-1;
 if(r>=0&&r<N&&c>=0&&c<N){
  suppressClick=true;
  choose(start.r,start.c).then(()=>{});
  setTimeout(()=>choose(r,c),30);
 }
},{passive:true});

startLevel();
</script>
</body>
</html>
